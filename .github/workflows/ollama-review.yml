name: Ollama Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlk/ollama-review-action@v1
        with:
          model: glm-5.3
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
