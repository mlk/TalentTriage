name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Junie Code Review
    # Secrets are not exposed to fork or Dependabot PRs — skip instead of failing red.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Junie review
        uses: JetBrains/junie-github-action@e4fbdc2fc0350e42e17e719e1390bd0de915bd09 # v1.7.20
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          # Update the same comment on subsequent Junie runs instead of adding new comments
          use_single_comment: true
          # Custom review prompt — see .junie/guidelines.md for detailed instructions
          prompt: |
            Review this pull request. Before reviewing, read AGENTS.md to understand the
            project's architecture, conventions, quality gates, and environment quirks.
            Follow the review guidelines in .junie/guidelines.md.
          model: "opus"
