name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `--continue` keeps the independent gates running after one fails
      # (detekt is scheduled first), so a lint finding does not hide the test
      # and coverage reports uploaded below.
      - name: Quality gates (tests, ktlint, detekt, coverage report + 80% verification)
        run: ./gradlew check jacocoTestReport --continue

      # The run itself needs a Google account, so the check is that the
      # executable and the commands are wired.
      - name: Verify the CLI entry point
        run: |
          ./gradlew installDist
          build/install/recruiter-cli/bin/recruiter-cli --help
          build/install/recruiter-cli/bin/recruiter-cli process-inbox --help

      # The standalone jar is the artifact of the launchd job, it has to run
      # with nothing but a JVM.
      - name: Verify the shadow jar
        run: |
          ./gradlew shadowJar
          java -jar build/libs/recruiter-cli.jar --help
          java -jar build/libs/recruiter-cli.jar process-inbox --help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 14
