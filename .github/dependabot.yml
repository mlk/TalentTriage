version: 2
updates:
  # Keeps the workflow action references up to date, including the SHA pin of
  # the JetBrains Junie action (Dependabot rewrites the SHA and the version
  # comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Keeps the version catalog (gradle/libs.versions.toml) up to date.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
